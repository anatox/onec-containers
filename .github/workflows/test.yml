name: Tests

permissions:
  contents: read

on:
  # Синхронизировано с build.yml; единственное отличие — без `!tests/**`, чтобы изменения в tests/** тоже запускали тесты.
  push:
    branches: [main]
    paths: &test_paths
      - '**/*'
      - '!**.md'
      - '!**.gitkeep'
      - '!**.gitattributes'
      - '!**.gitignore'
      - '!**.shellcheckrc'
      - '!.github/**'
      - '!.devcontainer/**'
      - '.github/workflows/test.yml'
      - 'bake'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths: *test_paths
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test-bakery:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: 'pyproject.toml'
      - name: Run bake select self-test
        run: python3 -m unittest tests/test_bake_select.py
