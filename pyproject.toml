[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-bakery"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["invoke>=3.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.6"]

[project.scripts]
bake = "bakery.main:main"

[tool.setuptools]
packages = ["bakery"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]
